name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          # Identifiants génériques, propres au CI : jamais les mêmes que ceux
          # utilisés en local, pour ne pas rendre publique une vraie réutilisation
          # de mot de passe
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: pokedex_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: api

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: api/package-lock.json

      - run: npm ci

      - name: Créer .env.test
        run: |
          echo "DATABASE_URL=postgresql://postgres:postgres@localhost:5432/pokedex_test" > .env.test
          echo "JWT_SECRET=${{ secrets.JWT_SECRET }}" >> .env.test

      - run: npm run lint

      - run: npm test
